<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Extract path after /LumiDecor/
      var path = location.pathname.replace(/^\/LumiDecor/, "");
      // Redirect to index.html with hash-based routing
      location.replace("/LumiDecor/#" + path + location.search + location.hash);
    </script>
  </head>
  <body>
    <h1>Redirecting…</h1>
  </body>
</html>
